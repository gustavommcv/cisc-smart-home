[platformio]
; Host tests only. The board is always built explicitly: pio run -e esp32dev
default_envs = native

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
lib_deps =
    bblanchon/ArduinoJson@7.4.3

[env:esp32dev]
; This platform release ships Arduino-ESP32 core 3.3.12.
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; The Wi-Fi stack and the web server fill the default 1.3 MB app partition to 95 %.
; huge_app has 3 MB and no OTA slot, which this project does not use.
board_build.partitions = huge_app.csv
build_flags =
    -Wall
    -Wextra
lib_deps =
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    madhephaestus/ESP32Servo@3.2.1
    duinowitchery/hd44780@1.3.2
    bblanchon/ArduinoJson@7.4.3
    esp32async/ESPAsyncWebServer@3.12.1
    esp32async/AsyncTCP@3.5.0
